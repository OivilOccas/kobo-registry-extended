  [packages.kobo-tweaks.uninstall]
  method      = "marker-remove"
  marker_file = "/mnt/onboard/.adds/tweaks/DELETE_TO_UNINSTALL.txt"
  purge_paths = ["/mnt/onboard/.adds/tweaks/**"]

# KOReader app-tree package (no KoboRoot.tgz).
[packages.koreader]
name        = "KOReader"
description = "Full-featured alternative document reader (EPUB, PDF, DjVu, CBZ)"
source      = "github.com/koreader/koreader"
forge       = "github"
asset       = "koreader-kobo-*.zip"
min_kpm     = "0.11.0"

  [packages.koreader.install]
  method = "app-tree"
  root   = "koreader"
  dest   = "/mnt/onboard/.adds/koreader"

    [packages.koreader.install.launcher]
    nm_file  = "/mnt/onboard/.adds/nm/koreader"
    nm_entry = "menu_item:main:KOReader:cmd_spawn:quiet:exec /mnt/onboard/.adds/koreader/koreader.sh"

  [packages.koreader.uninstall]
  method      = "manifest"
  purge_paths = ["/mnt/onboard/.adds/koreader/**"]

