# NickelSync self-uninstalls when its shipped trigger file is deleted.
[packages.nickelsync]
name        = "NickelSync"
description = "Add a NickelMenu \"Sync now\" item that connects Wi-Fi and starts a Kobo sync, also inside a book"
source      = "github.com/wolffshots/nickelsync"
forge       = "github"
asset       = "KoboRoot.tgz"
min_kpm     = "0.4.0"
nh_name     = "NickelSync"
tested_fw   = "4.46.23852"

  [packages.nickelsync.uninstall]
  method      = "marker-remove"
  marker_file = "/mnt/onboard/.adds/nickelsync/uninstall"
  extra_paths = ["/mnt/onboard/.adds/nm/nickelsync"]
  purge_paths = ["/mnt/onboard/.adds/nickelsync/**"]

  [[packages.nickelsync.configs]]
  name        = "Settings"
  path        = "/mnt/onboard/.adds/nickelsync/config.ini"
  format      = "ini"
  reload      = "auto"
  create      = true
  description = "Wi-Fi connect timeout, whether to turn Wi-Fi off again after a sync, and a quick sync of only the reading position inside a book."
  template = '''
[NickelSync]
; Seconds to wait for a Wi-Fi connection (10 to 180).
ConnectTimeout=60
; If Wi-Fi was off before the sync, turn it off again after the sync.
RestoreWifi=true
; Inside a book, sync only the reading position and skip the full sync.
QuickSync=false
'''

  [packages.nickelsync.checksums]
  "v0.1.0" = "4459b056ffe3869623f35ff034a44b02f37b0051e726b53576ec737516ee28e3"
  "v0.2.0" = "b2c3107e8ca78f948573881928d74d0fb189ad6f543f91553aad88656f0d9a77"
  "v0.2.1" = "b98676c6205ddfc0cf845a431c64063374a58b714fe1acdf15330c4dbea6d622"
  "v0.3.0" = "97deb4f0aaba9e40499f77d77ad8a5af5d4c215950686e9dc48c7633c4dbdad4"

